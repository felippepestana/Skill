# nginx.conf — Analista Processual (Hostinger KVM2 / Ubuntu 22.04)
# Substitua "seu-dominio.com.br" pelo seu domínio real.
# SSL gerado via: certbot --nginx -d seu-dominio.com.br

server {
    listen 80;
    server_name seu-dominio.com.br;
    # Redireciona todo HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seu-dominio.com.br;

    # Certificados gerados pelo certbot (não edite manualmente)
    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Logs
    access_log /var/log/nginx/analista_processual.access.log;
    error_log  /var/log/nginx/analista_processual.error.log;

    location / {
        proxy_pass         http://127.0.0.1:7860;
        proxy_http_version 1.1;

        # WebSocket — obrigatório para o Gradio 5.x
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido — análises podem levar 2–5 minutos
        proxy_read_timeout    600s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    600s;

        # Tamanho máximo de upload (PDFs grandes)
        client_max_body_size 50M;
    }
}
